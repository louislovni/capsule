.arrows { display: flex; gap: 6px; padding: 5px; border-radius: 40px; border: 1px solid #1d171229; background: #ffffff1f; }
.arrowb { width: 58px; height: 58px; border-radius: 29px; border: 0; display: grid; place-items: center; color: #e8571c; font-size: 22px; font-weight: 900;
  background: radial-gradient(circle at 40% 30%, #fffaea, #ead9b0 75%); box-shadow: inset 0 -3px 6px #78501e2e, 0 4px 10px #3c1e0a26;
  transition: transform .38s cubic-bezier(.34,1.56,.64,1); }
.cbar { display: flex; gap: 10px; padding: 12px 11px calc(env(safe-area-inset-bottom) + 8px); }
.cbar label { flex: 1; min-width: 0; height: 54px; border-radius: 27px; background: #1f1c1a; display: flex; align-items: center; gap: 10px; padding: 0 20px; color: #c9c2bb; }
.cbar input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #f4efe9; font-size: 16px; }
.cbar select { flex: none; max-width: 42%; height: 54px; border-radius: 27px; background: #1f1c1a; border: 0; color: #f4efe9; padding: 0 18px; font-weight: 600; font-size: 15px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="top">
    <div class="lens"></div>
    <div class="leds"><i></i><i></i><i></i></div>
    <h1>Capsule<small>Pokédex</small></h1>
    <div class="account" id="account"></div>
  </div>
  <nav id="tabs">
    <button data-tab="dex" class="on">Pokédex</button>
    <button data-tab="bank">Banque</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="trades">Échanges</button>
  </nav>
</header>

<main>
  <section id="welcome" class="welcome hidden">
    <div class="ball"></div>
    <h2>Ta banque Capsule, partout</h2>
    <p>Connecte-toi avec le compte Google de l'app : ta banque arrive depuis le cloud, et ton Pokédex se remplit avec chaque Pokémon que tu y as déposé.</p>
    <button class="big" id="signin">Se connecter avec Google</button>
    <button class="ghost" id="openfile">Ouvrir un fichier de banque</button>
    <input type="file" id="file" accept=".json,application/json" class="hidden">
    <p class="note">Active « Sauvegarde cloud » dans l'app pour que la banque soit envoyée.</p>
  </section>

  <section id="dex" class="hidden">
    <div class="hero">
      <div class="ring" id="ring"><div><b id="ringN">0</b><span id="ringT">/ 649</span></div></div>
      <div>
        <h2 id="heroTitle">Pokédex national</h2>
        <p id="heroSub"></p>
      </div>
    </div>
    <div class="chips" id="gens"></div>
    <div class="tools">
      <label class="search">🔎<input id="q" placeholder="Nom ou numéro" autocomplete="off"></label>
      <div class="seg" id="own">
        <button data-v="all" class="on">Tous</button><button data-v="have">Obtenus</button><button data-v="miss">Manquants</button><button data-v="shiny">✨</button>
      </div>
      <select id="type"><option value="">Tous les types</option></select>
    </div>
    <div id="dexGrid"></div>
  </section>

  <section id="bank" class="hidden">
    <div class="tools">
      <label class="search">🔎<input id="bq" placeholder="Nom, surnom, jeu, dresseur" autocomplete="off"></label>
      <select id="sort">
        <option value="date">Plus récents</option>
        <option value="dex">N° du Pokédex</option>
        <option value="level">Niveau</option>
        <option value="name">Nom</option>
      </select>
      <select id="bgame"><option value="">Tous les jeux</option></select>
    </div>
    <div id="bankGrid" class="grid bankgrid"></div>
  </section>

  <section id="stats" class="hidden"></section>
  <section id="trades" class="hidden"></section>
</main>

<div id="card"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

<script src="dex.js"></script>
<script src="config.js"></script>
<script type="module">
const DEX = window.CAPSULE_DEX, TYPES = window.CAPSULE_TYPES;
const MAX = 649;
const GENS = [
  { name: "Kanto", from: 1, to: 151 }, { name: "Johto", from: 152, to: 251 }, { name: "Hoenn", from: 252, to: 386 },
  { name: "Sinnoh", from: 387, to: 493 }, { name: "Unys", from: 494, to: 649 },
];
const TYPE_COLORS = ["#9fa19f","#ff8000","#81b9ef","#9141cb","#915121","#afa981","#91a119","#704170","#60a1b8","#e62829","#2980ef","#3fa129","#fac000","#ef4179","#3dcef3","#5060e1","#624d4e"];
const SPRITES = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/";
const sprite = (n, shiny, animated) => SPRITES + (animated ? "animated/" : "") + (shiny ? "shiny/" : "") + n + (animated ? ".gif" : ".png");
const pad = n => "#" + String(n).padStart(3, "0");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const STAT_NAMES = ["PV", "Attaque", "Défense", "Vitesse", "Atq. Spé.", "Déf. Spé."];

const state = { entries: [], byDex: new Map(), inGames: { games: [], dex: {} }, tab: "dex", gen: -1, own: "all", type: "", q: "", bq: "", sort: "date", bgame: "", source: null };

// ---------- Bank data ----------

function dexOf(e) {
  const d = e.details;
  if (d && d.nationalDex) return d.nationalDex;
  const g = e.generation;
  if (g === 1 || g === 2 || g === 4 || g === 5) return e.species;
  return e.species <= 251 ? e.species : null; // generation 3 numbers Hoenn its own way
}

function setBank(list, source) {
  state.entries = list.filter(e => e && !e.isEgg);
  state.eggs = list.filter(e => e && e.isEgg).length;
  state.byDex = new Map();
  for (const e of state.entries) {
    const n = dexOf(e);
    if (!n || n > MAX) continue;
    if (!state.byDex.has(n)) state.byDex.set(n, []);
    state.byDex.get(n).push(e);
  }
  state.source = source;
  const games = [...new Set(state.entries.map(e => e.sourceGame))].sort();
  $("bgame").innerHTML = '<option value="">Tous les jeux</option>' + games.map(g => `<option>${esc(g)}</option>`).join("");
  $("welcome").classList.add("hidden");
  show(state.tab);
}

function parseBank(text) {
  const json = JSON.parse(text);
  if (Array.isArray(json)) return json;
  if (json && Array.isArray(json.entries)) return json.entries;
  throw new Error("Ce fichier n'est pas une banque Capsule.");
}

function toast(text, ms = 3200) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ---------- Pokédex ----------

// Caught: in the bank, or in a PC box of a game (the app sends that list: users/UID/meta/pokedex).
const gameRec = n => state.inGames.dex[n];
const owned = n => state.byDex.has(n) || !!gameRec(n)?.g || !!gameRec(n)?.d;
const seenOnly = n => !owned(n) && !!gameRec(n)?.v;
const shinyOf = n => (state.byDex.get(n) || []).some(e => e.isShiny) || !!gameRec(n)?.s;
// "Pokemon - Version Emeraude (FR)" -> "Emeraude"
const prettyGame = t => t.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, "").replace(/^pok[eé]mon\s*[-:–]?\s*(version\s+)?/i, "").trim() || t;
const gameName = i => prettyGame(state.inGames.games[i] || "?");

// Species facts (tools/gen_pokedex_data.py, from PokeAPI), loaded the first time a sheet opens.
let INFO = null;
const infoReady = fetch("pokedex-data.json").then(r => r.json()).then(j => { INFO = j; }).catch(() => {});
const wordsOf = t => norm(t).split(/[^a-z0-9]+/).filter(w => w && w !== "pokemon" && w !== "version");
function versionsOfGame(name) { // "Pokemon - Version Noire 2 (France)" -> the Noir 2 version id
  if (!INFO) return [];
  const words = wordsOf(name), numbered = words.some(w => /^\d+$/.test(w));
  return Object.entries(INFO.versions).filter(([, v]) => {
    const want = wordsOf(v);
    if (want.some(w => /^\d+$/.test(w)) !== numbered) return false;
    return want.every(w => words.some(x => x.startsWith(w)));
  }).map(([id]) => +id);
}
function family(n) {
  const all = INFO?.species;
  if (!all) return [];
  const chain = all[n - 1].chain;
  const members = all.map((x, i) => ({ ...x, dex: i + 1 })).filter(x => x.chain === chain);
  if (members.length < 2) return [];
  const stages = [members.filter(x => !x.pre || all[x.pre - 1].chain !== chain)];
  for (;;) {
    const ids = new Set(stages[stages.length - 1].map(x => x.dex));
    const next = members.filter(x => ids.has(x.pre));
    if (!next.length) break;
    stages.push(next);
  }
  return stages;
}
const ownedCount = (from = 1, to = MAX) => { let c = 0; for (let d = from; d <= to; d++) if (owned(d)) c++; return c; };

function renderDex() {
  const have = ownedCount();
  let shinies = 0;
  for (let d = 1; d <= MAX; d++) if (shinyOf(d)) shinies++;
  $("ring").style.setProperty("--p", (have / MAX * 100).toFixed(1));
  $("ringN").textContent = have;
  $("heroSub").textContent = `${have} espèce${have > 1 ? "s" : ""} sur ${MAX} · ${state.entries.length} Pokémon dans la banque` +
    (state.inGames.games.length ? ` et ${state.inGames.games.length} jeu${state.inGames.games.length > 1 ? "x" : ""}` : "") +
    (shinies ? ` · ${shinies} chromatique${shinies > 1 ? "s" : ""}` : "");

  $("gens").innerHTML = [{ name: "Tous", from: 1, to: MAX }, ...GENS].map((g, i) => {
    const n = ownedCount(g.from, g.to);
    const total = g.to - g.from + 1;
    return `<button class="gen ${state.gen === i - 1 ? "on" : ""}" data-gen="${i - 1}"><b>${g.name}</b><span>${n} / ${total}</span>
      <div class="bar"><i style="width:${(n / total * 100).toFixed(1)}%"></i></div></button>`;
  }).join("");

  const q = norm(state.q.trim());
  const parts = [];
  const ranges = state.gen < 0 ? GENS : [GENS[state.gen]];
  for (const g of ranges) {
    const cells = [];
    for (let n = g.from; n <= g.to; n++) {
      const [name, t1, t2] = DEX[n];
      const list = state.byDex.get(n);
      const have = owned(n), seen = seenOnly(n), shiny = have && shinyOf(n), onlyGames = have && !list;
      if (state.own === "have" && !have) continue;
      if (state.own === "miss" && have) continue;
      if (state.own === "shiny" && !shiny) continue;
      if (state.type !== "" && t1 != state.type && t2 != state.type) continue;
      if (q && !norm(name).includes(q) && String(n) !== q.replace(/^#?0*/, "")) continue;
      cells.push(`<button class="cell ${have ? "own" : seen ? "seen" : "missing"}" data-dex="${n}"${have ? ` style="--tint:${pastelGradient(t1, t2, shiny, 140)}"` : ""}>
        <span class="no">${pad(n)}</span>${list && list.length > 1 ? `<span class="cnt">×${list.length}</span>` : onlyGames ? '<span class="cnt" title="Dans tes jeux">🎮</span>' : seen ? '<span class="cnt" title="Vu">👁</span>' : ""}
        <img class="sprite" loading="lazy" alt="" src="${sprite(n, shiny)}">
        ${shiny ? '<span class="star">★</span>' : ""}<div class="nm">${have || seen ? esc(name) : (state.own === "miss" || q ? esc(name) : "???")}</div></button>`);
    }
    if (!cells.length) continue;
    const n = ownedCount(g.from, g.to);
    parts.push(`<div class="section"><span>${g.name}</span><span>${n} / ${g.to - g.from + 1}</span></div><div class="grid">${cells.join("")}</div>`);
  }
  $("dexGrid").innerHTML = parts.join("") || '<div class="empty">Aucun Pokémon ne correspond.</div>';
}

function typeBadges(t1, t2) {
  const list = t1 === t2 ? [t1] : [t1, t2];
  return list.map(t => `<span class="type" style="background:${TYPE_COLORS[t]}">${esc(TYPES[t])}</span>`).join("");
}

async function openSpecies(n) {
  if (!INFO) { openSheet('<div class="grab"></div><div class="empty">Chargement…</div>'); await infoReady; }
  const [name, t1, t2, base] = DEX[n];
  const list = state.byDex.get(n) || [];
  const rec = gameRec(n) || {};
  const games = (rec.g || []).map(([i, c]) => `${gameName(i)}${c > 1 ? " ×" + c : ""}${(rec.t || []).includes(i) ? " (équipe)" : ""}`);
  const dexOnly = (rec.d || []).filter(i => !(rec.g || []).some(([g]) => g === i)).map(gameName);
  const have = owned(n), seen = seenOnly(n), known = have || seen;
  const info = INFO?.species?.[n - 1];
  let shiny = have && shinyOf(n);
  const total = base.reduce((a, b) => a + b, 0);
  const order = [0, 1, 2, 4, 5, 3]; // HP, Atk, Def, SpA, SpD, Spe as the games show them
  const labels = ["PV", "Attaque", "Défense", "Vitesse", "Atq. Spé.", "Déf. Spé."];
  const mine = [...new Set(state.inGames.games.flatMap(versionsOfGame))];
  const stages = family(n);
  const fmt = x => (x / 10).toFixed(1).replace(".", ",");
  const evoCard = m => {
    const k = owned(m.dex) || seenOnly(m.dex);
    return `<button class="${m.dex === n ? "on" : ""}" data-dex="${m.dex}"><img class="sprite" alt="" style="${owned(m.dex) ? "" : k ? "opacity:.45" : "filter:brightness(0);opacity:.6"}" src="${sprite(m.dex)}">
      <b>${k ? esc(DEX[m.dex][0]) : "???"}</b>${m.how ? `<small>${esc(m.how)}</small>` : ""}</button>`;
  };
  const versions = info?.where ? Object.keys(INFO.versions).map(Number).filter(v => info.where[v]) : [];
  const sortedVersions = [...versions.filter(v => mine.includes(v)), ...versions.filter(v => !mine.includes(v))];
  const html = () => `
    <div class="grab"></div><button class="close" data-close>✕</button>
    <div class="stage ${have ? "" : "unknown"}" style="--t1:${have ? TYPE_COLORS[t1] + "55" : "#ffffff14"}">
      <img class="sprite" alt="" style="${seen ? "filter:none;opacity:.5" : ""}" src="${sprite(n, shiny, have)}" onerror="this.onerror=null;this.src='${sprite(n, shiny)}'">
      ${have ? `<button class="pill toggle" data-shiny>${shiny ? "★ Chromatique" : "☆ Normal"}</button>` : ""}
    </div>
    <div class="title"><div class="no">${pad(n)}</div><h3>${known ? esc(name) : "???"}</h3>
      ${info?.c ? `<div class="no" style="margin:-4px 0 8px">${esc(info.c)}</div>` : ""}<div class="types">${typeBadges(t1, t2)}</div></div>
    <h4>Statistiques de base · ${total}</h4>
    ${order.map(i => `<div class="stat"><span>${labels[i]}</span><b>${base[i]}</b><div class="bar"><i style="width:${Math.min(100, base[i] / 180 * 100)}%;background:${base[i] >= 100 ? "#5fd36a" : base[i] >= 70 ? "#f5c542" : "#ff8a5c"}"></i></div></div>`).join("")}
    ${info ? `<h4>Fiche</h4><div class="facts"><div><span>Taille</span><b>${fmt(info.h)} m</b></div><div><span>Poids</span><b>${fmt(info.w)} kg</b></div></div>
      <div style="margin-top:10px">${info.a.map(a => Array.isArray(a) ? `<span class="abil">${esc(a[0])} <small>caché</small></span>` : `<span class="abil">${esc(a)}</span>`).join("")}</div>` : ""}
    ${stages.length ? `<h4>Évolutions</h4><div class="evo">${stages.map((st, i) => `${i ? '<div class="arrow">↓</div>' : ""}<div class="row">${st.map(evoCard).join("")}</div>`).join("")}</div>` : ""}
    <h4>Où tu l'as</h4>
    ${games.length ? `<p style="margin:0 0 6px">🎮 ${games.map(esc).join(" · ")}</p>` : ""}
    ${dexOnly.length ? `<p class="note" style="margin:0 0 6px">✓ Attrapé dans ${dexOnly.map(esc).join(", ")} (plus dans ses boîtes)</p>` : ""}
    ${seen ? `<p class="note" style="margin:0 0 6px">👁 Vu dans ${(rec.v || []).map(gameName).map(esc).join(", ")}, pas encore attrapé</p>` : ""}
    <div class="copies">${list.map(monCell).join("") || (have || seen ? "" : '<p class="note" style="margin:0">Pas encore rencontré.</p>')}</div>
    ${info ? `<h4>Où l'attraper</h4>${sortedVersions.length ? sortedVersions.map(v => `<details class="ver" ${mine.includes(v) ? "open" : ""}><summary>${esc(INFO.versions[v])}${mine.includes(v) ? '<span class="mine">ton jeu</span>' : ""}</summary>
      ${info.where[v].map(([loc, how, lo, hi]) => `<div class="place"><div>${esc(loc)}<small>${esc(how)}</small></div><em>Nv. ${lo}${hi !== lo ? "-" + hi : ""}</em></div>`).join("")}</details>`).join("")
      : '<p class="note" style="margin:0">Pas dans la nature : évolution, œuf, échange ou événement.</p>'}` : ""}`;
  openSheet(html());
  $("sheet").onclick = ev => {
    if (ev.target.closest("[data-shiny]")) { shiny = !shiny; $("sheet").innerHTML = html(); return; }
    if (ev.target.closest("summary")) return;
    sheetClick(ev);
  };
}

// ---------- The species card (Capsule's look, like the app's Pokédex) ----------

function hexHsl(hex) {
  const v = parseInt(hex.slice(1), 16), r = (v >> 16 & 255) / 255, g = (v >> 8 & 255) / 255, b = (v & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
// Pastel stops from the types (shinies lean another way), as the app draws its card.
function pastelGradient(t1, t2, shiny, angle = 135) {
  const p = (t, light, shift = 0) => {
    const [h, sat] = hexHsl(TYPE_COLORS[t]);
    return `hsl(${(h + shift + (shiny ? 45 : 0) + 360) % 360} ${Math.round(Math.min(sat, .6) * 100)}% ${light}%)`;
  };
  return `linear-gradient(${angle}deg, ${p(t1, 80)} 0%, ${p(t1, 86, 10)} 35%, ${p(t2, 81)} 68%, ${p(t1, 84, -10)} 100%)`;
}
const accentOf = t => { const [h, sat] = hexHsl(TYPE_COLORS[t]); return [`hsl(${h} ${Math.round(Math.min(Math.max(sat, .3), .6) * 100)}% 30%)`, `hsl(${h} ${Math.round(Math.min(Math.max(sat, .3), .6) * 100)}% 42%)`]; };

const SECTIONS = [["FICHE", "Fiche"], ["STATS", "Statistiques"], ["ÉVOL.", "Évolutions"], ["LIEUX", "Où l'attraper"]];
const card = { n: 1, sec: 0, shiny: false };

// The Pokémon the arrows step through: the grid's filters (got / missing / shiny, type).
function passes(n) {
  const [, t1, t2] = DEX[n];
  const have = owned(n);
  if (state.own === "have" && !have) return false;
  if (state.own === "miss" && have) return false;
  if (state.own === "shiny" && !(have && shinyOf(n))) return false;
  if (state.type !== "" && t1 != state.type && t2 != state.type) return false;
  return true;
}

async function openCard(n) {
  if (!INFO) await infoReady;
  card.n = n;
  card.shiny = owned(n) && shinyOf(n);
  renderCard();
  $("card").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeCard() {
  $("card").classList.remove("on");
  document.body.style.overflow = "";
  if (state.tab === "dex") renderDex();
}
function stepCard(by) {
  let n = card.n;
  for (let i = 0; i < MAX; i++) {
    n = (n - 1 + by + MAX) % MAX + 1;
    if (passes(n)) break;
  }
  card.n = n;
  card.shiny = owned(n) && shinyOf(n);
  renderCard();
}

function cardStatus(n) {
  if (seenOnly(n)) return "vu";
  if (!owned(n)) return "pas encore rencontré";
  const rec = gameRec(n) || {}, list = state.byDex.get(n) || [];
  const where = [list.length ? "banque" : "", (rec.g || []).length ? ((rec.g.length > 1 ? rec.g.length + " jeux" : "1 jeu")) : ""].filter(Boolean);
  return "obtenu" + (where.length ? " · " + where.join(" · ") : "") + (shinyOf(n) ? " · ★" : "");
}

function sectionHtml(n) {
  const [, t1, t2, base] = DEX[n];
  const have = owned(n), seen = seenOnly(n), known = have || seen;
  const info = INFO?.species?.[n - 1];
  const rec = gameRec(n) || {}, list = state.byDex.get(n) || [];
  if (card.sec === 0) {
    const games = (rec.g || []).map(([i, c]) => `${gameName(i)} × ${c}${(rec.t || []).includes(i) ? " (équipe)" : ""}`);
    const dexOnly = (rec.d || []).filter(i => !(rec.g || []).some(([g]) => g === i)).map(i => "attrapé dans " + gameName(i));
    const parts = [...(list.length ? [`Banque × ${list.length}`] : []), ...games, ...dexOnly];
    const where = have ? parts.join(" · ") : seen ? `Vu dans ${(rec.v || []).map(gameName).join(", ")}, pas encore attrapé.` : "Pas encore rencontré.";
    return `<div>${known && info ? `<div class="lbl">Talents</div><div>${info.a.map(a => Array.isArray(a)
        ? `<span class="chip">${esc(a[0])} <small>caché</small></span>` : `<span class="chip">${esc(a)}</span>`).join("")}</div>` : ""}
      <div class="lbl">Où tu l'as</div><div class="ctext">${esc(where)}</div>
      ${list.length ? `<div class="lbl">Dans la banque</div><div>${list.map(e => `<button class="chip" data-id="${esc(e.id)}">${esc(e.nickname || e.speciesName)}${e.isShiny ? " ★" : ""} <small>Nv. ${esc(e.details?.level ?? "?")} · ${esc(prettyGame(e.sourceGame || ""))}</small></button>`).join("")}</div>` : ""}</div>`;
  }
  if (card.sec === 1) {
    if (!known) return `<div class="ctext">Rencontre-le pour voir ses statistiques.</div>`;
    const labels = ["PV", "Attaque", "Défense", "Vitesse", "Atq. Spé.", "Déf. Spé."];
    return `<div>${[0, 1, 2, 4, 5, 3].map(i => `<div class="cstat"><span>${labels[i]}</span><b>${base[i]}</b><i><em style="width:${Math.min(100, base[i] / 180 * 100)}%"></em></i></div>`).join("")}
      <div class="lbl">Total ${base.reduce((a, b) => a + b, 0)}</div></div>`;
  }
  if (card.sec === 2) {
    const members = family(n).flat();
    if (members.length < 2) return `<div class="ctext">N'évolue pas.</div>`;
    return `<div>${members.map(m => { const k = owned(m.dex) || seenOnly(m.dex);
      return `<button class="crowb ${m.dex === n ? "on" : ""}" data-card="${m.dex}"><img class="sprite" alt="" style="${owned(m.dex) ? "" : k ? "opacity:.5" : "filter:brightness(0);opacity:.6"}" src="${sprite(m.dex)}">
        <b>${k ? esc(DEX[m.dex][0]) : "???"}</b>${m.how ? `<small>${esc(m.how)}</small>` : ""}</button>`; }).join("")}</div>`;
  }
  const mine = [...new Set(state.inGames.games.flatMap(versionsOfGame))];
  const versions = info?.where ? Object.keys(INFO.versions).map(Number).filter(v => info.where[v]) : [];
  const sorted = [...versions.filter(v => mine.includes(v)), ...versions.filter(v => !mine.includes(v))];
  if (!sorted.length) return `<div class="ctext">Pas dans la nature : évolution, œuf, échange ou événement.</div>`;
  return `<div>${sorted.flatMap(v => info.where[v].map(([loc, how, lo, hi]) =>
    `<div class="cplace ${mine.includes(v) ? "mine" : ""}"><div><b>${esc(INFO.versions[v])}</b> · ${esc(loc)}<small>${esc(how)}</small></div><em>Nv. ${lo}${hi !== lo ? "-" + hi : ""}</em></div>`)).join("")}</div>`;
}

function renderCard() {
  const n = card.n;
  const [name, t1, t2] = DEX[n];
  const have = owned(n), seen = seenOnly(n), known = have || seen;
  const info = INFO?.species?.[n - 1];
  const fmt = x => (x / 10).toFixed(1).replace(".", ",");
  const types = t1 === t2 ? [t1] : [t1, t2];
  const region = GENS.find(g => n >= g.from && n <= g.to);
  const [a1, a2] = known ? accentOf(t1) : ["#3a3a3a", "#555"];
  const gradient = known ? pastelGradient(t1, t2, card.shiny) : "linear-gradient(135deg, #cfcfcf, #e6e6e6 40%, #c4c4c4 70%, #dcdcdc)";
  const shown = known ? name : "???";
  const size = Math.max(30, Math.min(64, Math.floor(340 / (shown.length * 0.6))));
  $("card").innerHTML = `<div class="cap"><div class="face" style="--g:${gradient};--a1:${a1};--a2:${a2}">
    <div class="ctop">
      <button class="glass" data-act="close" title="Fermer">‹</button>
      <div style="flex:1"></div>
      ${have ? `<button class="glass ${card.shiny ? "lit" : ""}" data-act="shiny" title="Couleurs chromatiques">✦</button>` : ""}
      <select class="glass region" data-act="region" aria-label="Région">${GENS.map((g, i) => `<option value="${i}" ${g === region ? "selected" : ""}>${g.name}</option>`).join("")}</select>
    </div>
    <div class="cfacts">
      <div>N° ${String(n).padStart(3, "0")}${known && info?.c ? " · " + esc(info.c) : ""}</div>
      <div>Type : ${known ? types.map(t => esc(TYPES[t])).join(" · ") : "?"}</div>
      <div>Taille : ${known && info ? fmt(info.h) + " m" : "?"} · Poids : ${known && info ? fmt(info.w) + " kg" : "?"}</div>
      <div>Statut : ${cardStatus(n)}</div>
    </div>
    <div class="crow">
      <div class="orb ${have ? "" : seen ? "seen" : "unknown"}"><img class="sprite" alt="" src="${sprite(n, card.shiny, have)}" onerror="this.onerror=null;this.src='${sprite(n, card.shiny)}'"></div>
      <div class="wheel">
        <svg width="56" height="164" viewBox="0 0 56 164" aria-hidden="true"><path d="M56 0 C56 22 10 18 10 48 L10 116 C10 146 56 142 56 164 Z" fill="#0b0a09"/></svg>
        <div class="win"><div class="pill"></div><div class="strip snap">${SECTIONS.map(([s], i) => `<div class="it">${s}</div>`).join("")}</div></div>
        <div class="cap2"></div>
      </div>
    </div>
    <div class="cname" style="font-size:${size}px">${esc(shown)}</div>
    <div class="cbody">${sectionHtml(n)}</div>
    <div class="cfoot"><div class="cnt2">${ownedCount()} / ${MAX}<br>espèces obtenues</div>
      <div class="arrows"><button class="arrowb" data-act="prev" title="Précédent">⌃</button><button class="arrowb" data-act="next" title="Suivant">⌄</button></div></div>
  </div>
  <div class="cbar"><label>🔎<input id="cq" placeholder="Nom ou numéro" autocomplete="off" enterkeyhint="go"></label>
    <select id="cown">${[["all", "Tous"], ["have", "Obtenus"], ["miss", "Manquants"], ["shiny", "Chromatiques"]].map(([v, t]) => `<option value="${v}" ${state.own === v ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>`;
  placeWheel(card.sec);
  bindWheel();
}

function placeWheel(at, snap = true) {
  const strip = $("card").querySelector(".strip");
  if (!strip) return;
  strip.classList.toggle("snap", snap);
  strip.style.transform = `translateY(${59 - 17 - at * 34}px)`;
  [...strip.children].forEach((el, i) => {
    const d = Math.abs(i - at);
    el.classList.toggle("on", d < .5);
    el.style.opacity = d < .5 ? 1 : Math.max(0, .65 - (d - .5) * .45);
  });
}
let captionTimer = 0;
function setSection(i) {
  i = Math.max(0, Math.min(SECTIONS.length - 1, i));
  const changed = i !== card.sec;
  card.sec = i;
  placeWheel(i);
  const cap = $("card").querySelector(".cap2");
  cap.textContent = SECTIONS[i][1];
  cap.classList.add("on");
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => cap.classList.remove("on"), 1500);
  if (changed) {
    const body = $("card").querySelector(".cbody");
    body.innerHTML = sectionHtml(card.n);
    body.scrollTop = 0;
    navigator.vibrate?.(8);
  }
}
function bindWheel() {
  const win = $("card").querySelector(".win");
  let y0 = 0, start = 0, dragging = false, down = false;
  win.onpointerdown = e => { down = true; dragging = false; y0 = e.clientY; start = card.sec; win.setPointerCapture(e.pointerId); };
  win.onpointermove = e => {
    if (!down) return;
    const dy = e.clientY - y0;
    if (!dragging && Math.abs(dy) > 6) dragging = true;
    if (!dragging) return;
    let at = start - dy / 34;
    const last = SECTIONS.length - 1;
    if (at < 0) at /= 3; else if (at > last) at = last + (at - last) / 3;
    placeWheel(at, false);
  };
  win.onpointerup = e => {
    if (!down) return;
    down = false;
    if (dragging) {
      setSection(Math.round(start - (e.clientY - y0) / 34));
    } else {
      const slot = Math.round((e.clientY - win.getBoundingClientRect().top - 59) / 34);
      if (slot) setSection(card.sec + slot);
      const pill = win.querySelector(".pill");
      pill.classList.add("bounce");
      setTimeout(() => pill.classList.remove("bounce"), 160);
    }
  };
  win.onpointercancel = () => { down = false; placeWheel(card.sec); };
}

$("card").addEventListener("click", ev => {
  const act = ev.target.closest("[data-act]")?.dataset.act;
  if (act === "close") return closeCard();
  if (act === "prev") return stepCard(-1);
  if (act === "next") return stepCard(1);
  if (act === "shiny") { card.shiny = !card.shiny; return renderCard(); }
  const to = ev.target.closest("[data-card]");
  if (to) { card.n = +to.dataset.card; card.shiny = owned(card.n) && shinyOf(card.n); return renderCard(); }
  const mon = ev.target.closest("[data-id]");
  if (mon) return openMon(mon.dataset.id);
});
$("card").addEventListener("change", ev => {
  if (ev.target.dataset.act === "region") {
    const g = GENS[+ev.target.value];
    for (let d = g.from; d <= g.to; d++) if (passes(d)) { card.n = d; card.shiny = owned(d) && shinyOf(d); break; }
    renderCard();
  }
  if (ev.target.id === "cown") {
    state.own = ev.target.value;
    for (const x of $("own").children) x.classList.toggle("on", x.dataset.v === state.own);
    if (!passes(card.n)) stepCard(1); else renderCard();
  }
});
$("card").addEventListener("keydown", ev => {
  if (ev.target.id !== "cq" || ev.key !== "Enter") return;
  const q = norm(ev.target.value.trim());
  if (!q) return;
  for (let d = 1; d <= MAX; d++) {
    if (String(d) === q.replace(/^#?0*/, "") || ((owned(d) || seenOnly(d)) && norm(DEX[d][0]).includes(q))) {
      card.n = d; card.shiny = owned(d) && shinyOf(d); return renderCard();
    }
  }
  toast("Aucun Pokémon rencontré ne correspond.");
});
addEventListener("keydown", ev => {
  if (!$("card").classList.contains("on") || ev.target.tagName === "INPUT" || $("sheet").classList.contains("on")) return;
  if (ev.key === "Escape") closeCard();
  if (ev.key === "ArrowDown" || ev.key === "ArrowRight") { ev.preventDefault(); stepCard(1); }
  if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") { ev.preventDefault(); stepCard(-1); }
});
let touchX = 0, touchY = 0;
$("card").addEventListener("touchstart", ev => { touchX = ev.touches[0].clientX; touchY = ev.touches[0].clientY; }, { passive: true });
$("card").addEventListener("touchend", ev => {
  if (ev.target.closest(".wheel")) return;
  const dx = ev.changedTouches[0].clientX - touchX, dy = ev.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) stepCard(dx < 0 ? 1 : -1);
});

// ---------- Bank ----------

function monCell(e) {
  const n = dexOf(e);
  const d = e.details || {};
  const nick = e.nickname && norm(e.nickname) !== norm(e.speciesName) ? e.nickname : null;
  const img = n && n <= MAX ? `<img class="sprite" loading="lazy" alt="" src="${sprite(n, e.isShiny)}">` : `<img alt="">`;
  return `<button class="cell mon" data-id="${esc(e.id)}">${img}<div style="min-width:0">
    <div class="nm">${esc(nick || e.speciesName)}${e.isShiny ? ' <span style="color:var(--gold)">★</span>' : ""}${d.gender ? ` <span style="color:var(--dim)">${esc(d.gender)}</span>` : ""}</div>
    <div class="sub">${nick ? esc(e.speciesName) + " · " : ""}${d.level ? "Nv. " + d.level + " · " : ""}${esc(e.sourceGame)}</div>
    <div class="sub">DO ${esc(e.trainerName)}${n ? " · " + pad(n) : ""}</div></div></button>`;
}

function renderBank() {
  const q = norm(state.bq.trim());
  let list = state.entries.filter(e => {
    if (state.bgame && e.sourceGame !== state.bgame) return false;
    if (!q) return true;
    return [e.speciesName, e.nickname, e.sourceGame, e.trainerName, e.details?.nature, e.details?.ability].some(v => norm(v).includes(q));
  });
  const key = {
    date: (a, b) => String(b.depositedAt).localeCompare(String(a.depositedAt)),
    dex: (a, b) => (dexOf(a) || 9999) - (dexOf(b) || 9999),
    level: (a, b) => (b.details?.level || 0) - (a.details?.level || 0),
    name: (a, b) => norm(a.speciesName).localeCompare(norm(b.speciesName)),
  }[state.sort];
  list = list.slice().sort(key);
  $("bankGrid").innerHTML = list.map(monCell).join("") ||
    `<div class="empty">${state.entries.length ? "Aucun Pokémon ne correspond." : "Ta banque est vide pour l'instant."}</div>`;
}

function openMon(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  const d = e.details || {};
  const n = dexOf(e);
  const sp = n && n <= MAX ? DEX[n] : null;
  const gb = e.generation === 1 || e.generation === 2;
  const labels = d.statLabels || STAT_NAMES;
  const rows = labels.map((l, i) => {
    const iv = d.ivs?.[i], ev = d.evs?.[i], st = d.stats?.[i];
    const max = gb ? 15 : 31;
    return `<tr><td>${esc(l)}</td><td>${st ?? "–"}</td><td class="${iv === max ? "perfect" : ""}">${iv ?? "–"}</td><td>${ev ?? "–"}</td></tr>`;
  }).join("");
  const kv = [
    ["Niveau", d.level], ["Nature", d.nature], ["Talent", d.ability], ["Objet", d.heldItem],
    ["Dresseur", e.trainerName + (d.trainerID != null ? ` · ID ${String(d.trainerID).padStart(5, "0")}` : "")],
    ["Rencontre", [d.metLocation, d.metLevel === 0 ? "œuf" : d.metLevel ? "Nv. " + d.metLevel : null, d.metDate].filter(Boolean).join(" · ")],
    ["Ball", d.ball], ["Jeu d'origine", d.originGame], ["Déposé depuis", e.sourceGame],
    ["Dans la banque depuis", e.depositedAt ? new Date(e.depositedAt).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : null],
    ["Puissance cachée", d.hiddenPower], ["Pokérus", d.pokerus], ["Rubans", d.ribbons || null],
  ].filter(([, v]) => v !== undefined && v !== null && v !== "");
  const nick = e.nickname && norm(e.nickname) !== norm(e.speciesName) ? e.nickname : null;
  openSheet(`
    <div class="grab"></div><button class="close" data-close>✕</button>
    <div class="stage" style="--t1:${sp ? TYPE_COLORS[sp[1]] : "#555"}55">
      ${n && n <= MAX ? `<img class="sprite" alt="" src="${sprite(n, e.isShiny, true)}" onerror="this.onerror=null;this.src='${sprite(n, e.isShiny)}'">` : ""}
    </div>
    <div class="title"><div class="no">${n ? pad(n) : ""}${e.isShiny ? ' · <span style="color:var(--gold)">★ Chromatique</span>' : ""}</div>
      <h3>${esc(nick || e.speciesName)} ${d.gender ? `<span style="color:var(--dim);font-size:20px">${esc(d.gender)}</span>` : ""}</h3>
      ${nick ? `<div class="no" style="margin:-6px 0 8px">${esc(e.speciesName)}</div>` : ""}
      <div class="types">${sp ? typeBadges(sp[1], sp[2]) : ""}</div></div>
    <h4>Fiche</h4>
    <div class="kv">${kv.map(([k, v]) => `<span>${esc(k)}</span><div>${esc(v)}</div>`).join("")}</div>
    ${d.moves?.length ? `<h4>Attaques</h4><div class="moves">${d.moves.map(m => `<div>${esc(m.name)}<small>${m.pp} PP</small></div>`).join("")}</div>` : ""}
    ${d.ivs ? `<h4>Statistiques</h4><table class="ivs"><tr><th></th><th>Stat</th><th>${gb ? "DV" : "IV"}</th><th>${gb ? "Exp. stat" : "EV"}</th></tr>${rows}</table>` : ""}
    ${n && n <= MAX ? `<h4>Pokédex</h4><div class="copies"><button class="cell mon" data-dex="${n}"><img class="sprite" alt="" src="${sprite(n)}"><div><div class="nm">Voir ${esc(DEX[n][0])} dans le Pokédex</div></div></button></div>` : ""}
  `);
  $("sheet").onclick = sheetClick;
}

// ---------- Stats ----------

function renderStats() {
  const es = state.entries;
  const shinies = es.filter(e => e.isShiny);
  const levels = es.map(e => e.details?.level).filter(Boolean);
  const byGame = {}, byType = {};
  for (const e of es) {
    byGame[e.sourceGame] = (byGame[e.sourceGame] || 0) + 1;
    const n = dexOf(e);
    if (n && n <= MAX) {
      const [, t1, t2] = DEX[n];
      byType[t1] = (byType[t1] || 0) + 1;
      if (t2 !== t1) byType[t2] = (byType[t2] || 0) + 1;
    }
  }
  const bars = (obj, label, color) => {
    const list = Object.entries(obj).sort((a, b) => b[1] - a[1]);
    const top = list[0]?.[1] || 1;
    return list.map(([k, v]) => `<div class="row"><span>${esc(label(k))}</span><div class="bar"><i style="width:${v / top * 100}%;background:${color(k)}"></i></div><b>${v}</b></div>`).join("");
  };
  const counts = [...state.byDex.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 6);
  $("stats").innerHTML = `
    <div class="cards">
      <div class="card"><b>${es.length}</b><span>Pokémon dans la banque</span></div>
      <div class="card"><b>${ownedCount()}</b><span>espèces sur ${MAX}</span></div>
      <div class="card"><b style="color:var(--gold)">${shinies.length}</b><span>chromatiques</span></div>
      <div class="card"><b>${levels.length ? Math.max(...levels) : "–"}</b><span>niveau le plus haut</span></div>
    </div>
    ${shinies.length ? `<div class="section"><span>Chromatiques</span></div><div class="grid bankgrid">${shinies.map(monCell).join("")}</div>` : ""}
    <div class="section"><span>Par jeu</span></div><div class="card rows">${bars(byGame, k => k, () => "var(--red2)") || '<span>Rien pour l\'instant.</span>'}</div>
    <div class="section"><span>Par type</span></div><div class="card rows">${bars(byType, k => TYPES[k], k => TYPE_COLORS[k])}</div>
    ${counts.length ? `<div class="section"><span>Les plus nombreux</span></div><div class="grid">${counts.map(([n, l]) => `<button class="cell" data-dex="${n}"><span class="cnt">×${l.length}</span><img class="sprite" loading="lazy" alt="" src="${sprite(n)}"><div class="nm">${esc(DEX[n][0])}</div></button>`).join("")}</div>` : ""}`;
}

// ---------- Sheet & navigation ----------

function openSheet(html) {
  $("sheet").innerHTML = html;
  $("sheet").scrollTop = 0;
  $("sheet").classList.add("on");
  $("veil").classList.add("on");
}
function closeSheet() {
  $("sheet").classList.remove("on");
  $("veil").classList.remove("on");
  $("sheet").onclick = sheetClick;
}
function sheetClick(ev) {
  if (ev.target.closest("[data-close]")) return closeSheet();
  const dex = ev.target.closest("[data-dex]");
  if (dex) { closeSheet(); return openCard(+dex.dataset.dex); }
  const mon = ev.target.closest("[data-id]");
  if (mon) return openMon(mon.dataset.id);
}
$("veil").onclick = closeSheet;
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function show(tab) {
  state.tab = tab;
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === tab);
  const ready = state.source !== null;
  for (const id of ["dex", "bank", "stats", "trades"]) $(id).classList.toggle("hidden", !ready || id !== tab);
  if (tab !== "trades") leaveTrade();
  if (!ready) return;
  if (tab === "trades") renderTrades();
  if (tab === "dex") renderDex();
  if (tab === "bank") renderBank();
  if (tab === "stats") renderStats();
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { show(b.dataset.tab); scrollTo({ top: 0 }); } };
$("gens").onclick = e => { const b = e.target.closest("[data-gen]"); if (b) { state.gen = +b.dataset.gen; renderDex(); } };
$("own").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  state.own = b.dataset.v;
  for (const x of $("own").children) x.classList.toggle("on", x === b);
  renderDex();
};
$("type").innerHTML += TYPES.map((t, i) => `<option value="${i}">${esc(t)}</option>`).join("");
$("type").onchange = e => { state.type = e.target.value; renderDex(); };
$("q").oninput = e => { state.q = e.target.value; renderDex(); };
$("bq").oninput = e => { state.bq = e.target.value; renderBank(); };
$("sort").onchange = e => { state.sort = e.target.value; renderBank(); };
$("bgame").onchange = e => { state.bgame = e.target.value; renderBank(); };
for (const id of ["dexGrid", "bankGrid", "stats"]) $(id).onclick = sheetClick;

// ---------- Opening a file ----------

$("openfile").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { setBank(parseBank(await f.text()), "file"); renderAccount(); toast(`${state.entries.length} Pokémon chargés depuis le fichier.`); }
  catch (err) { toast(err.message); }
};

// ---------- Account & cloud ----------

const cfg = window.CAPSULE_FIREBASE || {};
let fb = null;

async function firebase() {
  if (fb) return fb;
  if (!cfg.apiKey) throw new Error("La connexion n'est pas encore configurée sur cette page.");
  const v = "10.12.2";
  const [app, auth, store] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`),
  ]);
  const a = app.initializeApp(cfg);
  fb = { auth, store, authApp: auth.getAuth(a), db: store.getFirestore(a) };
  return fb;
}

function renderAccount(user) {
  const el = $("account");
  if (user) {
    el.innerHTML = `<button class="pill" id="refresh" title="Recharger">↻</button>` +
      (user.photoURL ? `<img class="avatar" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : "") +
      `<button class="pill" id="signout">Quitter</button>`;
    $("refresh").onclick = () => loadCloud(user, true);
    $("signout").onclick = async () => {
      await fb.auth.signOut(fb.authApp);
      try { localStorage.removeItem("capsule.bank"); localStorage.removeItem("capsule.games"); } catch {}
      location.reload();
    };
  } else if (state.source === "file") {
    el.innerHTML = `<button class="pill" id="close">Fermer</button>`;
    $("close").onclick = () => location.reload();
  } else {
    el.innerHTML = "";
  }
}

let currentUser = null;

// The bank file in the cloud, as the app writes it (users/UID/files + chunks, see CloudSync.swift).
async function readCloudBank(uid) {
  const { store, db } = fb;
  const files = await store.getDocs(store.collection(db, "users", uid, "files"));
  const doc = files.docs.find(d => d.data().name === "#banque");
  if (!doc) return null;
  const meta = doc.data();
  const pieces = await Promise.all(Array.from({ length: meta.chunks }, (_, i) =>
    store.getDoc(store.doc(db, "users", uid, "chunks", `${doc.id}_${meta.version}_${i}`))));
  const b64 = pieces.map(p => p.data()?.data || "").join("");
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const text = new TextDecoder().decode(bytes);
  return { id: doc.id, meta, text };
}

const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

async function writeCloudBank(uid, file, payload) {
  const { store, db } = fb;
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  const hash = hex(await crypto.subtle.digest("SHA-256", bytes));
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  const b64 = btoa(bin);
  const pieces = [];
  for (let i = 0; i < b64.length; i += 600000) pieces.push(b64.slice(i, i + 600000));
  if (!pieces.length) pieces.push("");
  const version = hash.slice(0, 12);
  // The pieces first: the description, written last, points at them.
  for (let i = 0; i < pieces.length; i++) {
    await store.setDoc(store.doc(db, "users", uid, "chunks", `${file.id}_${version}_${i}`), { data: pieces[i] });
  }
  await store.setDoc(store.doc(db, "users", uid, "files", file.id), {
    name: "#banque", hash, size: bytes.length, chunks: pieces.length, version,
    updatedAt: store.Timestamp.now(), device: "Page web",
  });
  if (file.meta.version !== version) {
    for (let i = 0; i < file.meta.chunks; i++) {
      store.deleteDoc(store.doc(db, "users", uid, "chunks", `${file.id}_${file.meta.version}_${i}`)).catch(() => {});
    }
  }
  return new TextDecoder().decode(bytes);
}

async function loadGamesDex(uid) {
  try {
    const snap = await fb.store.getDoc(fb.store.doc(fb.db, "users", uid, "meta", "pokedex"));
    const json = snap.exists() ? JSON.parse(snap.data().json || "{}") : {};
    state.inGames = { games: json.games || [], dex: json.dex || {} };
    try { localStorage.setItem("capsule.games", JSON.stringify(state.inGames)); } catch {}
  } catch { /* the bank alone, then */ }
}

async function loadCloud(user, manual) {
  const file = await readCloudBank(user.uid);
  if (!file) {
    setBank([], "cloud");
    toast("Aucune banque dans le cloud : active la sauvegarde cloud dans l'app.", 5000);
    return;
  }
  const { text } = file, { updatedAt } = file.meta;
  await loadGamesDex(user.uid);
  setBank(parseBank(text), "cloud");
  try { localStorage.setItem("capsule.bank", text); } catch {}
  if (manual) {
    const when = updatedAt?.toDate ? updatedAt.toDate().toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }) : "";
    toast(`Banque à jour${when ? " · envoyée le " + when : ""}.`);
  }
}

$("signin").onclick = async () => {
  try {
    const { auth, authApp } = await firebase();
    const provider = new auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(authApp, provider); }
    catch (err) {
      if (err.code === "auth/popup-blocked") await auth.signInWithRedirect(authApp, provider);
      else throw err;
    }
  } catch (err) {
    if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") toast(err.message, 5000);
  }
};

async function start() {
  const params = new URLSearchParams(location.search);
  if (params.has("sample")) { // local preview: ?sample=file.json
    setBank(parseBank(await (await fetch(params.get("sample"))).text()), "file");
    renderAccount();
    return;
  }
  try {
    const games = localStorage.getItem("capsule.games");
    if (games) state.inGames = JSON.parse(games);
    const cached = localStorage.getItem("capsule.bank");
    if (cached) setBank(parseBank(cached), "cache");
  } catch {}
  if (!cfg.apiKey) { if (state.source === null) $("welcome").classList.remove("hidden"); return; }
  try {
    const { auth, authApp } = await firebase();
    auth.onAuthStateChanged(authApp, async user => {
      currentUser = user;
      renderAccount(user);
      if (!user) {
        try { localStorage.removeItem("capsule.bank"); } catch {}
        state.source = null;
        show(state.tab);
        $("welcome").classList.remove("hidden");
        return;
      }
      try { await loadCloud(user, false); }
      catch (err) { toast("Le cloud n'a pas répondu : " + err.message, 5000); }
    });
  } catch (err) {
    if (state.source === null) $("welcome").classList.remove("hidden");
    toast(err.message, 5000);
  }
}
start();

// ---------- Trades with friends (the app's online trades, see RemoteTrade.swift) ----------

const T = { profile: null, friends: [], trades: [], room: null, unsub: null, busy: false };
const nowISO = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z"); // the app reads dates without milliseconds
const pairID = (a, b) => (a < b ? `${a}_${b}` : `${b}_${a}`);

function needCloud() {
  if (currentUser && fb) return null;
  return `<div class="welcome"><div class="ball"></div><h2>Échanges en ligne</h2>
    <p>Connecte-toi avec le compte Google de l'app pour échanger avec tes amis depuis ici.</p>
    ${cfg.apiKey ? '<button class="big" data-act="signin">Se connecter avec Google</button>' : ""}</div>`;
}

async function loadSocial() {
  const { store, db } = fb, uid = currentUser.uid;
  const prof = await store.getDoc(store.doc(db, "profiles", uid));
  T.profile = prof.exists() ? prof.data() : null;
  const fr = await store.getDocs(store.query(store.collection(db, "friendships"), store.where("members", "array-contains", uid)));
  T.friends = fr.docs.map(d => {
    const x = d.data(), other = x.members.find(m => m !== uid);
    return { id: d.id, uid: other, name: x.names?.[other] || "?", accepted: !!x.accepted, mine: x.requester === uid };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const tr = await store.getDocs(store.query(store.collection(db, "trades"), store.where("members", "array-contains", uid)));
  T.trades = tr.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => {
    const other = x.members.find(m => m !== uid);
    const updated = x.updatedAt?.toDate ? x.updatedAt.toDate() : new Date(0);
    return !x["done_" + uid] && !x["cancel_" + uid] && !x["cancel_" + other] && Date.now() - updated < 7 * 86400e3;
  }).map(x => ({ id: x.id, friend: x.members.find(m => m !== uid), name: x.names?.[x.members.find(m => m !== uid)] || "?" }));
}

async function renderTrades() {
  const el = $("trades");
  const gate = needCloud();
  if (gate) { el.innerHTML = gate; return; }
  if (T.room) return renderRoom();
  el.innerHTML = '<div class="empty">Chargement…</div>';
  try { await loadSocial(); }
  catch (err) { el.innerHTML = `<div class="empty">Impossible de charger tes amis : ${esc(err.message)}</div>`; return; }
  if (!T.profile) {
    el.innerHTML = `<div class="empty">Ouvre une fois « Amis et échanges en ligne » dans l'app : ton profil et ton code ami y sont créés.</div>`;
    return;
  }
  const requests = T.friends.filter(f => !f.accepted && !f.mine);
  const waiting = T.friends.filter(f => !f.accepted && f.mine);
  const friends = T.friends.filter(f => f.accepted);
  el.innerHTML = `
    <div class="box"><h3>Ton code ami</h3><div class="code">${esc(T.profile.code)}</div>
      <p class="note" style="margin:6px 0 0">${esc(T.profile.name)} · donne ce code à un ami pour qu'il t'ajoute.</p></div>
    ${T.trades.length ? `<div class="box"><h3>Échanges en cours</h3>${T.trades.map(t => `<div class="line"><div class="who">Avec ${esc(t.name)}</div>
      <button class="btn" data-act="open" data-trade="${esc(t.id)}">Reprendre</button></div>`).join("")}</div>` : ""}
    ${requests.length ? `<div class="box"><h3>Demandes d'ami</h3>${requests.map(f => `<div class="line"><div class="who">${esc(f.name)}</div>
      <button class="btn" data-act="accept" data-f="${esc(f.id)}">Accepter</button><button class="btn alt" data-act="drop" data-f="${esc(f.id)}">Refuser</button></div>`).join("")}</div>` : ""}
    <div class="box"><h3>Amis</h3>
      ${friends.map(f => `<div class="line"><div class="who">${esc(f.name)}</div><button class="btn" data-act="trade" data-f="${esc(f.id)}">Échanger</button></div>`).join("") || '<p class="note" style="margin:0">Pas encore d\'ami : ajoute-en un avec son code.</p>'}
      ${waiting.map(f => `<div class="line"><div class="who">${esc(f.name)}<small>Demande envoyée, en attente</small></div><button class="btn alt" data-act="drop" data-f="${esc(f.id)}">Annuler</button></div>`).join("")}
    </div>
    <div class="box"><h3>Ajouter un ami</h3><div class="inrow"><input id="fcode" maxlength="6" placeholder="CODE" autocomplete="off"><button class="btn" data-act="add">Ajouter</button></div></div>`;
}

async function addFriend(raw) {
  const { store, db } = fb, uid = currentUser.uid;
  const code = raw.toUpperCase().replace(/\s/g, "");
  if (code.length !== 6) throw new Error("Un code ami a 6 caractères.");
  const entry = await store.getDoc(store.doc(db, "codes", code));
  const other = entry.exists() ? entry.data().uid : null;
  if (!other) throw new Error(`Aucun joueur avec le code ${code}.`);
  if (other === uid) throw new Error("C'est ton propre code.");
  const pair = pairID(uid, other);
  const existing = await store.getDoc(store.doc(db, "friendships", pair)).catch(() => null);
  if (existing && existing.exists()) {
    const x = existing.data();
    if (x.requester === other && !x.accepted) await store.updateDoc(existing.ref, { accepted: true });
    return;
  }
  const prof = await store.getDoc(store.doc(db, "profiles", other));
  await store.setDoc(store.doc(db, "friendships", pair), {
    members: [uid, other], names: { [uid]: T.profile.name, [other]: prof.data()?.name || "?" },
    requester: uid, accepted: false, createdAt: store.Timestamp.now(),
  });
}

async function startTrade(friend) {
  const open = T.trades.find(t => t.friend === friend.uid);
  if (open) return open.id;
  const { store, db } = fb, uid = currentUser.uid;
  const ref = await store.addDoc(store.collection(db, "trades"), {
    members: [uid, friend.uid], pair: friend.id, starter: uid,
    names: { [uid]: T.profile.name, [friend.uid]: friend.name },
    createdAt: store.Timestamp.now(), updatedAt: store.Timestamp.now(),
  });
  return ref.id;
}

$("trades").onclick = async ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return sheetClick(ev);
  if (T.busy) return;
  const act = b.dataset.act;
  if (act === "signin") return $("signin").click();
  const { store, db } = fb;
  const friend = T.friends.find(f => f.id === b.dataset.f);
  T.busy = true;
  b.disabled = true;
  try {
    if (act === "add") { await addFriend($("fcode").value); toast("Demande envoyée."); }
    if (act === "accept") await store.updateDoc(store.doc(db, "friendships", friend.id), { accepted: true });
    if (act === "drop") await store.deleteDoc(store.doc(db, "friendships", friend.id));
    if (act === "trade") return enterTrade(await startTrade(friend));
    if (act === "open") return enterTrade(b.dataset.trade);
    if (act === "pick") return pickOffer();
    if (act === "confirm") return confirmTrade();
    if (act === "cancel") return cancelTrade();
    if (act === "back") { leaveTrade(); }
  } catch (err) {
    toast(err.message, 5000);
  } finally {
    T.busy = false;
    b.disabled = false;
  }
  if (["add", "accept", "drop", "back"].includes(act)) renderTrades();
};

// ---------- Trade room ----------

const parseOffer = json => { try { return json ? JSON.parse(json) : null; } catch { return null; } };

function enterTrade(id) {
  leaveTrade();
  const { store, db } = fb, uid = currentUser.uid;
  T.room = { id, phase: "loading", mine: null, theirs: null, iConfirmed: false, theirConfirm: "", name: "", committed: false, first: true };
  renderRoom();
  T.unsub = store.onSnapshot(store.doc(db, "trades", id), snap => onRoom(snap, uid), err => {
    if (T.room) { T.room.phase = "failed"; T.room.reason = err.message; renderRoom(); }
  });
}

function leaveTrade() {
  if (T.unsub) T.unsub();
  T.unsub = null;
  T.room = null;
}

async function onRoom(snap, uid) {
  const r = T.room;
  if (!r || ["finished", "cancelled"].includes(r.phase)) return;
  if (!snap.exists()) {
    if (!r.committed) { r.phase = "cancelled"; r.reason = "Cet échange n'existe plus."; }
    return renderRoom();
  }
  const x = snap.data(), other = x.members.find(m => m !== uid);
  r.other = other;
  r.name = x.names?.[other] || "?";
  if (r.first) {
    r.first = false;
    const mine = parseOffer(x["offer_" + uid]), theirs = parseOffer(x["offer_" + other]);
    if (x["done_" + uid]) { r.phase = "finished"; r.received = theirs; r.given = mine; return renderRoom(); }
    r.mine = mine;
    r.iConfirmed = !!(mine && theirs && x["confirm_" + uid] === `${mine.id}|${theirs.id}`);
  }
  if (x["cancel_" + other] && !r.committed) { r.phase = "cancelled"; r.reason = `${r.name} a annulé l'échange.`; return renderRoom(); }
  const offer = parseOffer(x["offer_" + other]);
  if (offer?.id !== r.theirs?.id) {
    r.theirs = offer;
    if (r.iConfirmed) { // their choice changed: my agreement was for the other one
      r.iConfirmed = false;
      fb.store.updateDoc(snap.ref, { ["confirm_" + uid]: "", updatedAt: fb.store.Timestamp.now() }).catch(() => {});
    }
  }
  r.theirConfirm = x["confirm_" + other] || "";
  if (r.phase === "loading") r.phase = "open";
  renderRoom();
  await commitIfReady();
}

const theyConfirmed = r => !!(r.mine && r.theirs && r.theirConfirm === `${r.theirs.id}|${r.mine.id}`);

function renderRoom() {
  const r = T.room, el = $("trades");
  if (!r) return;
  const back = '<button class="btn alt" data-act="back" style="margin-bottom:12px">‹ Amis</button>';
  if (r.phase === "loading") { el.innerHTML = back + '<div class="empty">Ouverture de l\'échange…</div>'; return; }
  if (r.phase === "finished") {
    el.innerHTML = back + `<div class="box done"><div class="big-ico">✅</div><h3>Échange terminé !</h3>
      <p>${r.received ? monCell(r.received) : ""}</p>
      <p class="note">${esc(r.received?.speciesName || "Le Pokémon")} a rejoint ta banque${r.given ? `, à la place de ${esc(r.given.speciesName)}` : ""}.
      S'il doit évoluer par échange, il le fera dans l'app à sa prochaine synchronisation.</p></div>`;
    return;
  }
  if (r.phase === "cancelled" || r.phase === "failed") {
    el.innerHTML = back + `<div class="box done"><div class="big-ico">${r.phase === "failed" ? "⚠️" : "✖️"}</div><h3>${r.phase === "failed" ? "Problème" : "Échange annulé"}</h3><p class="note">${esc(r.reason)}</p></div>`;
    return;
  }
  const they = theyConfirmed(r);
  el.innerHTML = back + `<div class="box">
    <h3>Échange avec ${esc(r.name)}</h3>
    <div class="side"><h4>Tu reçois</h4>
      ${r.theirs ? monCell(r.theirs) : `<div class="slot">${esc(r.name)} n'a pas encore choisi.</div>`}
      ${r.theirs ? (they ? `<div class="ok">✓ ${esc(r.name)} a validé</div>` : `<div class="wait">${esc(r.name)} n'a pas encore validé.</div>`) : ""}</div>
    <div class="swap">⇅</div>
    <div class="side"><h4>Tu donnes</h4>
      ${r.mine ? monCell(r.mine) : ""}
      <button class="slot" data-act="pick" ${r.iConfirmed ? "disabled" : ""}>${r.mine ? "Changer de Pokémon" : "Choisir un Pokémon de ta banque"}</button></div>
    <div class="actions">
      <button class="btn" data-act="confirm" ${!r.mine || !r.theirs || r.iConfirmed ? "disabled" : ""}>${r.iConfirmed ? (they ? "Échange…" : "Validé, on attend " + esc(r.name)) : "Valider l'échange"}</button>
      <button class="btn alt" data-act="cancel">Annuler</button>
    </div></div>`;
}

function pickOffer() {
  const list = state.entries.slice().sort((a, b) => (dexOf(a) || 9999) - (dexOf(b) || 9999));
  openSheet(`<div class="grab"></div><button class="close" data-close>✕</button>
    <h4 style="margin-top:14px">Quel Pokémon proposer ?</h4>
    <label class="search" style="margin-bottom:10px">🔎<input id="pq" placeholder="Rechercher" autocomplete="off"></label>
    <div id="plist" class="copies">${list.map(monCell).join("")}</div>`);
  $("pq").oninput = e => {
    const q = norm(e.target.value);
    $("plist").innerHTML = list.filter(x => [x.speciesName, x.nickname, x.sourceGame].some(v => norm(v).includes(q))).map(monCell).join("");
  };
  $("sheet").onclick = async ev => {
    if (ev.target.closest("[data-close]")) return closeSheet();
    const m = ev.target.closest("[data-id]");
    if (!m) return;
    const entry = state.entries.find(x => x.id === m.dataset.id);
    closeSheet();
    const r = T.room, uid = currentUser.uid;
    if (!r || !entry) return;
    r.mine = entry;
    r.iConfirmed = false;
    renderRoom();
    try {
      await fb.store.updateDoc(fb.store.doc(fb.db, "trades", r.id), {
        ["offer_" + uid]: JSON.stringify(entry), ["confirm_" + uid]: "", updatedAt: fb.store.Timestamp.now(),
      });
    } catch (err) { toast(err.message, 5000); }
  };
}

async function confirmTrade() {
  const r = T.room, uid = currentUser.uid;
  if (!r?.mine || !r.theirs || r.committed) return;
  r.iConfirmed = true;
  renderRoom();
  try {
    await fb.store.updateDoc(fb.store.doc(fb.db, "trades", r.id), {
      ["confirm_" + uid]: `${r.mine.id}|${r.theirs.id}`, updatedAt: fb.store.Timestamp.now(),
    });
    await commitIfReady();
  } catch (err) { r.iConfirmed = false; renderRoom(); toast(err.message, 5000); }
}

async function cancelTrade() {
  const r = T.room, uid = currentUser.uid;
  if (!r || r.committed) return;
  await fb.store.updateDoc(fb.store.doc(fb.db, "trades", r.id), { ["cancel_" + uid]: true, updatedAt: fb.store.Timestamp.now() }).catch(() => {});
  r.phase = "cancelled";
  r.reason = "Échange annulé.";
  renderRoom();
}

// Both sides agreed on the same pair: swap in the cloud bank (the app merges it at its next sync).
async function commitIfReady() {
  const r = T.room, uid = currentUser?.uid;
  if (!r || r.committed || !r.iConfirmed || !theyConfirmed(r)) return;
  r.committed = true;
  try {
    const file = await readCloudBank(uid);
    if (!file) throw new Error("Ta banque n'est pas dans le cloud.");
    const payload = JSON.parse(file.text);
    const entries = Array.isArray(payload) ? payload : payload.entries;
    const removed = Array.isArray(payload) ? [] : (payload.removed || []);
    const at = entries.findIndex(e => e.id === r.mine.id);
    if (at < 0) throw new Error("Ce Pokémon n'est plus dans ta banque.");
    const received = JSON.parse(JSON.stringify(r.theirs));
    // A Pokémon that once left this bank keeps its old id in the tombstones: a new one keeps it from being dropped.
    if (entries.some(e => e.id === received.id) || removed.includes(received.id)) received.id = crypto.randomUUID().toUpperCase();
    received.depositedAt = nowISO();
    received.tradedFor = r.mine.isEgg ? 0 : (dexOf(r.mine) || 0);
    entries[at] = received;
    const gone = new Set(removed);
    gone.add(r.mine.id);
    gone.delete(received.id);
    const text = await writeCloudBank(uid, file, { entries, removed: [...gone].sort() });
    try { localStorage.setItem("capsule.bank", text); } catch {}
    setBank(parseBank(text), "cloud");
    await fb.store.updateDoc(fb.store.doc(fb.db, "trades", r.id), { ["done_" + uid]: true, updatedAt: fb.store.Timestamp.now() }).catch(() => {});
    r.phase = "finished";
    r.received = received;
    r.given = r.mine;
    renderRoom();
  } catch (err) {
    r.committed = false;
    r.phase = "failed";
    r.reason = err.message;
    renderRoom();
  }
}
