<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121216">
<title>Capsule · Pokédex</title>
<link rel="icon" href="icon.png">
<style>
:root {
  --bg: #121216; --panel: #1b1b21; --panel2: #24242c; --line: #2f2f39;
  --text: #f1f1f4; --dim: #9a9aa8; --red: #e5383b; --red2: #ff5a5f; --gold: #f5c542;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img.sprite { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ---------- Header ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, #b3121b, #8c0d15);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 0;
  box-shadow: 0 4px 18px #0008;
}
.top { display: flex; align-items: center; gap: 12px; max-width: 1200px; margin: 0 auto; }
.lens {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #bfe9ff, #2aa9e0 45%, #0b5d8a 75%);
  border: 3px solid #f4f4f4; box-shadow: 0 0 0 2px #0004, inset 0 -3px 6px #0005;
}
.leds { display: flex; gap: 5px; }
.leds i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #0005; }
.leds i:nth-child(1) { background: #ff6262; } .leds i:nth-child(2) { background: #ffd84a; } .leds i:nth-child(3) { background: #5fd36a; }
h1 { font-size: 19px; margin: 0; letter-spacing: .3px; flex: 1; }
h1 small { font-weight: 500; opacity: .75; font-size: 13px; margin-left: 6px; }
.account { display: flex; align-items: center; gap: 8px; }
.pill {
  border: 0; background: #fff2; color: #fff; padding: 7px 13px; border-radius: 999px; font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.pill:hover { background: #fff3; }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff6; }
nav { display: flex; gap: 4px; max-width: 1200px; margin: 10px auto 0; }
nav button {
  flex: 1; border: 0; background: none; color: #ffd6d6; padding: 10px 0 11px; font-weight: 600; font-size: 15px;
  border-bottom: 3px solid transparent;
}
nav button.on { color: #fff; border-color: #fff; }

main { max-width: 1200px; margin: 0 auto; padding: 16px 14px calc(env(safe-area-inset-bottom) + 40px); }
.hidden { display: none !important; }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--panel); border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); }
.ring { --p: 0; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--red2) calc(var(--p) * 1%), #2c2c35 0); }
.ring div { width: 82px; height: 82px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring b { font-size: 22px; } .ring span { font-size: 12px; color: var(--dim); }
.hero h2 { margin: 0 0 4px; font-size: 20px; }
.hero p { margin: 0; color: var(--dim); font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -14px 0; padding: 0 14px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.gen {
  flex: none; min-width: 112px; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 11px;
}
.gen.on { border-color: var(--red2); background: #2a1719; }
.gen b { display: block; font-size: 14px; } .gen span { font-size: 12px; color: var(--dim); }
.bar { height: 5px; border-radius: 3px; background: #2c2c35; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red2); border-radius: 3px; }

/* ---------- Tools ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.search { flex: 1 1 220px; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search input { flex: 1; background: none; border: 0; outline: 0; padding: 11px 6px; font-size: 16px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 11px; border-radius: 9px; font-size: 14px; color: var(--dim); }
.seg button.on { background: var(--panel2); color: var(--text); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; font-size: 14px; }

/* ---------- Grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; }
.cell {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 4px 4px 8px; text-align: center; transition: transform .12s, border-color .12s;
}
.cell:hover { transform: translateY(-2px); border-color: #4a4a57; }
.cell img { width: 88px; height: 88px; display: block; margin: 0 auto; }
.cell .no { position: absolute; top: 6px; left: 8px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.cell .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .cnt { position: absolute; top: 5px; right: 7px; font-size: 11px; background: var(--panel2); border-radius: 8px; padding: 1px 6px; color: var(--dim); }
.cell.missing img { filter: brightness(0) invert(.18); opacity: .7; }
.cell.missing .nm { color: #5c5c68; }
.cell.seen img { opacity: .45; }
.cell.seen .nm { color: var(--dim); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts div { background: var(--panel2); border-radius: 10px; padding: 9px 11px; }
.facts span { display: block; font-size: 12px; color: var(--dim); }
.facts b { font-size: 16px; }
.abil { display: inline-block; background: var(--panel2); border-radius: 999px; padding: 5px 11px; margin: 0 6px 6px 0; font-size: 14px; }
.abil small { color: var(--dim); }
.evo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.evo .row { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; justify-content: center; }
.evo .arrow { color: var(--dim); }
.evo button { flex: none; width: 118px; background: var(--panel2); border: 1px solid transparent; border-radius: 12px; padding: 6px 4px 8px; }
.evo button.on { border-color: var(--red2); background: #2a1719; }
.evo img { width: 56px; height: 56px; display: block; margin: 0 auto; }
.evo b { display: block; font-size: 13px; }
.evo small { display: block; font-size: 11px; color: var(--dim); line-height: 1.3; }
details.ver { background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
details.ver summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
details.ver summary::after { content: "›"; margin-left: auto; color: var(--dim); transition: transform .15s; }
details.ver[open] summary::after { transform: rotate(90deg); }
.mine { font-size: 11px; background: var(--red); color: #fff; border-radius: 999px; padding: 2px 7px; }
.place { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.place:first-of-type { border-top: 0; margin-top: 6px; }
.place small { display: block; color: var(--dim); font-size: 12px; }
.place em { font-style: normal; color: var(--dim); font-size: 12px; white-space: nowrap; }
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 7px; }
  .cell img { width: 72px; height: 72px; }
  .cell .nm { font-size: 12px; }
  .cell .star { bottom: 26px !important; }
}
.cell .star { position: absolute; bottom: 30px; right: 8px; color: var(--gold); font-size: 15px; text-shadow: 0 0 6px #f5c54299; }
.section { margin: 22px 2px 10px; font-size: 15px; color: var(--dim); font-weight: 600; display: flex; justify-content: space-between; }
.empty { text-align: center; color: var(--dim); padding: 40px 10px; }

/* ---------- Bank list ---------- */
.mon { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px 8px 6px; }
.mon img { width: 64px; height: 64px; flex: none; margin: 0; }
.mon .nm { font-size: 15px; }
.mon .sub { font-size: 12px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bankgrid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

/* ---------- Sheet ---------- */
.veil { position: fixed; inset: 0; background: #000a; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.veil.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 50; left: 50%; bottom: 0; width: min(560px, 100%); max-height: 92vh; overflow-y: auto;
  transform: translate(-50%, 104%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
  background: var(--panel); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 0 18px calc(env(safe-area-inset-bottom) + 22px);
}
.sheet.on { transform: translate(-50%, 0); }
@media (min-width: 700px) {
  .sheet { bottom: auto; top: 50%; border-radius: 22px; border-bottom: 1px solid var(--line); transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: #444; margin: 9px auto 0; }
.close { position: sticky; top: 8px; float: right; border: 0; background: var(--panel2); width: 32px; height: 32px; border-radius: 50%; font-size: 17px; margin-top: 4px; z-index: 2; }
.stage {
  height: 190px; display: grid; place-items: center; margin: 6px -18px 0; position: relative;
  background: radial-gradient(ellipse at 50% 75%, var(--t1, #444) 0%, transparent 62%);
}
.stage img { width: 160px; height: 160px; object-fit: contain; }
.stage.unknown img { filter: brightness(0); opacity: .85; }
@media (max-width: 520px) {
  .leds, h1 small { display: none; }
  .account .pill { padding: 7px 11px; }
}
.stage .toggle { position: absolute; right: 18px; bottom: 10px; }
.title { text-align: center; }
.title .no { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.title h3 { margin: 2px 0 8px; font-size: 26px; }
.types { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.type { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #0006; }
h4 { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }
.stat { display: grid; grid-template-columns: 82px 34px 1fr; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.stat span:first-child { color: var(--dim); }
.stat b { text-align: right; font-variant-numeric: tabular-nums; }
.stat .bar { margin: 0; height: 7px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv span { color: var(--dim); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.moves div { background: var(--panel2); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.moves small { color: var(--dim); float: right; }
table.ivs { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.ivs td, table.ivs th { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--line); }
table.ivs th { color: var(--dim); font-weight: 500; }
table.ivs td:first-child, table.ivs th:first-child { text-align: left; color: var(--dim); }
.perfect { color: var(--gold); font-weight: 700; }
.copies .cell { margin-bottom: 7px; }

/* ---------- Stats ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card b { font-size: 26px; display: block; } .card span { color: var(--dim); font-size: 13px; }
.rows .row { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; margin: 8px 0; }
.rows .row .bar { margin: 0; height: 9px; }
.rows .row b { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Trades ---------- */
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.box h3 { margin: 0 0 10px; font-size: 16px; }
.code { font: 700 26px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 4px; }
.line { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.line:first-of-type { border-top: 0; }
.line .who { flex: 1; min-width: 0; }
.line .who small { display: block; color: var(--dim); font-size: 12px; }
.btn { border: 0; background: var(--red); color: #fff; font-weight: 700; padding: 8px 14px; border-radius: 10px; font-size: 14px; }
.btn.alt { background: var(--panel2); color: var(--text); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.inrow { display: flex; gap: 8px; }
.inrow input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; outline: 0; }
.side { margin: 6px 0 14px; }
.side h4 { margin: 0 0 6px; }
.side .cell { width: 100%; margin-bottom: 6px; }
.slot { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--dim); font-size: 14px; width: 100%; background: none; }
.ok { color: #5fd36a; font-weight: 600; font-size: 14px; margin-top: 6px; }
.wait { color: var(--dim); font-size: 14px; margin-top: 6px; }
.swap { text-align: center; font-size: 22px; color: var(--dim); margin: -4px 0 2px; }
.actions { display: flex; gap: 8px; margin-top: 8px; }
.actions .btn { flex: 1; padding: 12px; }
.done { text-align: center; padding: 18px 6px; }
.done .big-ico { font-size: 52px; }

/* ---------- Welcome ---------- */
.welcome { max-width: 460px; margin: 40px auto; text-align: center; }
.welcome .ball {
  width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; position: relative;
  background: linear-gradient(180deg, var(--red) 0 46%, #111 46% 54%, #eee 54%);
  box-shadow: inset 0 -6px 12px #0004, 0 8px 30px #e5383b44;
}
.welcome .ball::after { content: ""; position: absolute; inset: 33px; border-radius: 50%; background: #eee; border: 6px solid #111; }
.welcome h2 { margin: 0 0 8px; }
.welcome p { color: var(--dim); line-height: 1.5; }
.big { border: 0; background: var(--red); color: #fff; font-weight: 700; padding: 13px 22px; border-radius: 14px; font-size: 16px; margin: 6px; }
.ghost { border: 1px solid var(--line); background: var(--panel); padding: 12px 18px; border-radius: 14px; margin: 6px; font-size: 15px; }
.note { font-size: 13px; color: var(--dim); margin-top: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); background: #2b2b33; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; box-shadow: 0 8px 30px #0009; max-width: 92vw; }

/* ---------- Capsule look (2026-11): dark, soft, the species card like the app's ---------- */
:root { --bg: #0b0a09; --panel: #171513; --panel2: #221f1c; --line: #2c2824; }
header { background: #0b0a09; box-shadow: none; border-bottom: 1px solid #1c1a18; }
.lens { background: radial-gradient(circle at 35% 30%, #fff6, #fff1 70%), linear-gradient(135deg, #9fc9a6, #e0dcae); border: 0; box-shadow: none; }
.leds { display: none; }
h1 { font-weight: 800; letter-spacing: -.4px; }
nav { gap: 6px; padding-bottom: 10px; }
nav button { flex: none; padding: 8px 16px; border-radius: 999px; border: 0; color: #b8b0a8; }
nav button.on { background: #f4efe9; color: #120f0d; }
.cell { border-radius: 18px; }
.cell.own { background: var(--tint, var(--panel)); border-color: transparent; color: #1d1712; }
.cell.own .no, .cell.own .cnt { color: #1d1712b0; background: none; }
.gen { border-radius: 16px; }
.gen.on { border-color: #f4efe9; background: #221f1c; }
.bar i { background: #f4efe9; }
.ring { background: conic-gradient(#f4efe9 calc(var(--p) * 1%), #2c2824 0); }

#card { position: fixed; inset: 0; z-index: 45; background: #0b0a09; display: none; justify-content: center; align-items: stretch; }
#card.on { display: flex; }
.cap { width: min(440px, 100vw); height: 100dvh; max-height: 940px; margin: auto 0; padding: 5px; display: flex; flex-direction: column; color: #1d1712; font-family: Inter, var(--font); }
.face { flex: 1; min-height: 0; border-radius: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background-image: var(--g); background-size: 220% 220%; animation: drift 18s ease-in-out infinite; transition: background-image .5s; }
.face::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 60% at 85% 18%, #ffffff61, #fff0 60%), radial-gradient(90% 50% at 10% 90%, #0000001a, #0000 70%); }
@keyframes drift { 0%, 100% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } }
.face > * { position: relative; }
.ctop { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 16px) 16px 0; }
.glass { width: 48px; height: 48px; border-radius: 24px; border: 1px solid #fff9; display: grid; place-items: center; font-size: 19px; color: #1d1712;
  background: radial-gradient(circle at 35% 30%, #ffffffc0, #ffffff47 70%); box-shadow: 0 8px 18px #3c1e0a24, inset 0 -2px 4px #3c1e0a14;
  transition: transform .38s cubic-bezier(.34,1.56,.64,1); }
.glass:active, .arrowb:active { transform: scale(.88) translateY(2px); }
.glass.lit { background: radial-gradient(circle at 35% 30%, #fff3c0, #ffd166 75%); }
.glass.region { width: auto; padding: 0 20px; font-size: 16px; font-weight: 600; }
.cfacts { padding: 18px 22px 0; font-size: 11px; line-height: 19px; letter-spacing: 1.7px; text-transform: uppercase; color: #1d1712c7; }
.crow { display: flex; align-items: center; padding-left: 22px; margin-top: 4px; }
.orb { width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 40% 35%, #ffffff8c, #ffffff26 70%); animation: float 4s ease-in-out infinite; }
.orb img { width: 118px; height: 118px; object-fit: contain; animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
.orb.unknown img { filter: brightness(0); opacity: .8; }
.orb.seen img { opacity: .55; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
.wheel { margin-left: auto; position: relative; width: 56px; height: 164px; flex: none; touch-action: none; user-select: none; }
.wheel svg { position: absolute; inset: 0; }
.wheel .win { position: absolute; right: 0; top: 23px; width: 46px; height: 118px; overflow: hidden; cursor: grab; }
.wheel .pill { position: absolute; left: 4px; top: 32px; width: 38px; height: 54px; border-radius: 19px; background: linear-gradient(180deg, var(--a2), var(--a1));
  box-shadow: inset 0 1px 0 #fff5, 0 4px 10px #0006; transition: transform .2s; }
.wheel .pill.bounce { transform: scale(1.14); }
.wheel .strip { position: absolute; left: 0; top: 0; width: 46px; }
.wheel .strip.snap { transition: transform .45s cubic-bezier(.34,1.4,.64,1); }
.wheel .it { height: 34px; display: grid; place-items: center; font-size: 8px; font-weight: 800; letter-spacing: .4px; color: #becbc4; transition: color .25s, opacity .25s; }
.wheel .it.on { color: #fff; }
.wheel .cap2 { position: absolute; right: 62px; top: 68px; white-space: nowrap; background: #0b0a09e0; color: #fff; font-size: 11px; font-weight: 600;
  padding: 6px 10px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.wheel .cap2.on { opacity: 1; }
.cname { padding: 0 60px 0 22px; font-family: "Bricolage Grotesque", Inter, var(--font); font-weight: 800; line-height: 1.02; letter-spacing: -1.6px; color: #120f0d;
  white-space: nowrap; animation: rise .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: none; } }
.cbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 22px 12px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(#000 88%, #0000); mask-image: linear-gradient(#000 88%, #0000); }
.cbody::-webkit-scrollbar { display: none; }
.cbody > div { animation: rise .4s cubic-bezier(.2,.9,.3,1.2) both; }
.lbl { font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; color: #1d1712b3; margin: 10px 0 8px; }
.lbl:first-child { margin-top: 0; }
.chip { display: inline-block; padding: 9px 16px; border-radius: 20px; background: #ffffff73; font-size: 14px; font-weight: 500; margin: 0 6px 6px 0; }
.chip small { color: #1d171299; font-size: 12px; }
.ctext { font-size: 15px; line-height: 21px; }
.cstat { display: grid; grid-template-columns: 78px 34px 1fr; gap: 8px; align-items: center; margin: 7px 0; }

.crowb { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; padding: 6px 16px 6px 6px; border-radius: 26px; background: #ffffff66; margin-bottom: 6px; color: #1d1712; }
.crowb.on { background: #ffffffb3; }

.crowb b { flex: 1; font-size: 15px; }
.crowb small { font-size: 12px; color: #1d1712a8; text-align: right; }
.cplace { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-radius: 22px; background: #ffffff61; margin-bottom: 6px; font-size: 14px; }
.cplace.mine { background: #ffffff9c; }
.cplace small { display: block; font-size: 12px; color: #1d1712a8; }
