# Builds an unsigned IPA on a GitHub-hosted Mac. Download it from the run's
# "Artifacts" section, then sign and install it with AltStore, SideStore or Sideloadly.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: C tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the C core and run its tests
        run: sh scripts/build_core.sh host

  windows:
    permissions:
      contents: write
    name: Windows (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Install MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Build Capsule for Windows
        # The Google sign-in of Capsule.exe needs an OAuth client of type "Desktop app" in the
        # Firebase project's Google Cloud console; without these secrets it plays offline only.
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          CAPSULE_VERSION: 0.1.${{ github.run_number }}
        run: sh scripts/build_core.sh windows
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-Windows
          path: build/Capsule-Windows.zip
          if-no-files-found: error
      - name: Publish it (release "windows")
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          gh release view windows >/dev/null 2>&1 || \
            gh release create windows --title "Capsule pour Windows" --latest=false \
              --notes "Télécharge Capsule-Windows.zip, décompresse-le et lance Capsule.exe (voir LISEZMOI.txt)."
          gh release edit windows --title "Capsule 0.1.$RUN pour Windows"
          gh release upload windows build/Capsule-Windows.zip --clobber

  android:
    permissions:
      contents: write
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Build Capsule for Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The same Google "Desktop app" client as Windows: the cloud saves' sign-in.
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: sh scripts/build_android.sh "1.6.0.${{ github.run_number }}" "$((1000 + ${{ github.run_number }}))"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-apk
          path: build/Capsule.apk
          if-no-files-found: error
      - name: Publish it (release v1.6.0.N, which the app's updater finds)
        # Only builds signed with Capsule's key: a debug-signed APK can't update an install.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          gh release create "v1.6.0.$RUN" build/Capsule.apk --title "Capsule 1.6.0.$RUN pour Android" --latest=false \
            --notes "$(git log -1 --pretty=%s)"
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^v1\.6\.0\.' | sort -t. -k4 -n -r | tail -n +4 | \
            while read old; do gh release delete "$old" --yes --cleanup-tag; done

  ipa:
    permissions:
      contents: write
    name: IPA (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Build the C core for iOS
        run: sh scripts/build_core.sh ios

      - name: Firebase config (online accounts)
        # App/GoogleService-Info.plist turns the online accounts on. It can be committed (its
        # values aren't secrets: the database's rules guard the data) or come from this secret,
        # the file's contents in base64.
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO" ]; then
            echo "$GOOGLE_SERVICE_INFO" | base64 --decode > App/GoogleService-Info.plist
          fi
          if [ -f App/GoogleService-Info.plist ]; then echo "online accounts: on"; else echo "online accounts: off (no GoogleService-Info.plist)"; fi
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Capsule.xcodeproj \
            -scheme CapsuleGBA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build/xcodebuild.log | tail -n 200

      - name: Package the IPA
        run: |
          APP="build/xcode/Build/Products/Release-iphoneos/CapsuleGBA.app"
          test -d "$APP"
          # PokeDaisy's cores: frameworks the app opens by path.
          mkdir -p "$APP/Frameworks"
          cp -R build/frameworks/*.framework "$APP/Frameworks/"
          ls "$APP/Frameworks"
          for f in "$APP"/Frameworks/*.framework; do
            n="$(basename "$f" .framework)"
            echo "== $n"
            otool -L "$f/$n"
            otool -l "$f/$n" | grep -A4 LC_BUILD_VERSION | head -5
            file "$f/$n"
          done
          # Ad-hoc signature (no certificate): sideloading tools re-sign with the user's account, but
          # AltStore reads the app's entitlements from an existing signature and refuses an unsigned
          # binary ("The data couldn't be read because it isn't in the correct format").
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>get-task-allow</key><true/></dict></plist>' > build/entitlements.plist
          for f in "$APP"/Frameworks/*.framework; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements build/entitlements.plist "$APP"
          codesign -d --entitlements - "$APP"
          codesign --verify --deep --strict "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Capsule.ipa Payload)
          ls -lh build/Capsule.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-ipa
          path: build/Capsule.ipa
          if-no-files-found: error

      - name: Publish the build for AltStore / SideStore
        # Each build of main: a release with the IPA, and the source (a fixed release, "altstore")
        # pointing at it, so AltStore offers it as an update. The last 5 builds are kept.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          TAG="build-$RUN"
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "$TAG" build/Capsule.ipa --title "Capsule 0.1.$RUN" --notes "$NOTES" --prerelease
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Capsule.ipa"
          python3 scripts/altstore_source.py build/Capsule.ipa "0.1.$RUN" "$RUN" "$URL" "$NOTES" build/source.json
          gh release view altstore >/dev/null 2>&1 || \
            gh release create altstore --title "Source AltStore" --latest=false \
              --notes "Ajoute dans AltStore (Sources > +) : https://github.com/${{ github.repository }}/releases/download/altstore/source.json"
          gh release upload altstore build/source.json --clobber
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 | \
            while read old; do gh release delete "$old" --yes --cleanup-tag; done

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
